<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="heading">
        <h2>Submit your application</h2>
        <p>for .NET Developer (Fresher)</p>
    </div>
    <div>
        <div class="personal">
            <p>Personal information</p>
        </div>
        <form id="myform">
            <div class="formdetails">
                <div>
                    <label>Name as per ID proof*</label><br>
                    <input type="text" name="name" id="name" placeholder="Name">
                    <span class="error" style="color: red;" id="nameError"></span>
                </div>
                <div>
                    <label>Father name*</label><br>
                    <input type="text" name="Fathername" id="fathername" placeholder="FatherName">
                    <span class="error" style="color: red;" id="fathernameError"></span>

                </div>
                <div>
                    <label>Email*</label><br>
                    <input type="text" name="email" id="email" placeholder="email">
                    <span class="error" style="color: red;" id="emailError"></span>

                </div>

                <div class="dobmobile">
                    <div>

                        <label for="dob">Date Of birth*</label><br>
                        <input type="date" name="dob" id="dob">
                        <span class="error" style="color: red;" id="dobError"></span>

                    </div>
                    <div>

                        <label for="mobile"> Mobile*</label><br>
                        <input type="text" name="mobile" id="mobile">
                        <span class="error" style="color: red;" id="mobileError"></span>

                    </div>

                </div>
                <div>
                    <label>Current address</label><br>
                    <input type="text" name="Currentaddress1" id="Currentaddress1" placeholder="address line1">
                    <span class="error" style="color: red;" id="currentaddress1Error"></span>

                </div>
                <div>
                    <label for=""></label><br>
                    <input type="text" name="Currentaddress2" id="Currentaddress2" placeholder="address line2">
                    <span class="error" style="color: red;" id="currentaddress2Error"></span>

                </div>
                <div class="citystate">
                    <div class="city">

                        <input type="text" name="Currentcity" id="Currentcity" placeholder="city">
                        <span class="error" style="color: red;" id="currentcityError"></span>
                    </div>
                    <div>

                        <select name="currentstate" id="currentstate">
                            <option value="">select</option>
                            <option value="tamilnadu">tamilnadu</option>
                            <option value="kerala">kerala</option>
                            <option value="karnataka">karnataka</option>
                        </select>
                        <span class="error" style="color: red;" id="currentstateError"></span>
                    </div>



                </div>
                <div>
                    <input type="text" id="Currentzipcode" placeholder="zipcode">
                    <span class="error" style="color: red;" id="currentzipError"></span>

                </div>

                <div class="permanent">
                    <div class="permanentheading">

                        <p>Permanent address* </p>

                        <input id="permanentcheckbox" type="checkbox">
                        <p> Same as current address</p><br>
                    </div>
                    <input type="text" name="permanentaddress1" id="permanentaddress1" placeholder="address line1">
                    <span class="error" style="color: red;" id="permanentaddress1Error"></span>

                </div>
                <div>
                    <label for=""></label><br><br>
                    <input type="text" name="permanentaddress2" id="permanentaddress2" placeholder="address line2">
                    <span class="error" style="color: red;" id="permanentaddress2Error"></span>

                </div>
                <div class="citystate">
                    <div class="city">

                        <input type="text" name="permanentcity" id="permanentcity" placeholder="city">
                        <span class="error" style="color: red;" id="permanentcityError"></span>
                    </div>
                    <div>

                        <select name="permanentstate" id="permanentstate">
                            <option value="">select</option>
                            <option value="tamilnadu">tamilnadu</option>
                            <option value="kerala">kerala</option>
                            <option value="karnataka">karnataka</option>
                        </select>
                        <span class="error" style="color: red;" id="permanentstateError"></span>
                    </div>



                </div>
                <div>
                    <input type="text" id="permanentzipcode" placeholder="zipcode">
                    <span class="error" style="color: red;" id="permanentZipError"></span>

                </div>
            </div>

            <div class="upload">
                <p>Upload profile </p>
                <p>Please upload photo of yourself. your face should be clear .Make sure image size does not exceed
                    500kb</p>
                <input type="file" value="Upload photo" id="photo" placeholder="upload photo">
                <span class="error" style="color: red;" id="uploadError"></span>

            </div>
            <div class="submit">
                <button type="submit">submit</button>
            </div>


        </form>
    </div>
    <script src="script.js"></script>

</body>

</html>
